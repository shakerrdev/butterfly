[project]
name = "butterfly"
version = "0.1.0"
description = "CS2 player rating from match-win probability added, learned from demos"
readme = "README.md"
authors = [
    { name = "shakerrdev", email = "shakerrdev@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "demoparser2>=0.42.1",
    "huggingface-hub>=2.4.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
]

[project.scripts]
butterfly = "butterfly:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
